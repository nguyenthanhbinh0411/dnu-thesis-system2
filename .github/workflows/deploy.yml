name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'README*'
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: Skip frontend build
        required: false
        default: false
        type: boolean
      skip_backend:
        description: Skip backend build
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      skip_frontend: ${{ steps.flags.outputs.skip_frontend }}
      skip_backend: ${{ steps.flags.outputs.skip_backend }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate required GitHub Secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in SERVER_HOST SERVER_USER SERVER_SSH_PORT SERVER_APP_DIR PUBLIC_PORT SERVER_SSH_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set. Please add it in GitHub Secrets."
              exit 1
            fi
            echo "✓ $name: [SET]"
          done

      - name: Export workflow flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          skip_frontend=false
          skip_backend=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.skip_frontend }}" = "true" ]; then skip_frontend=true; fi
            if [ "${{ inputs.skip_backend }}" = "true" ]; then skip_backend=true; fi
          fi
          echo "skip_frontend=$skip_frontend" >> "$GITHUB_OUTPUT"
          echo "skip_backend=$skip_backend" >> "$GITHUB_OUTPUT"

  deploy:
    name: Build and Deploy to Server
    needs: validate
    if: always() && needs.validate.result != 'failed'
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
      PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SKIP_BACKEND: ${{ needs.validate.outputs.skip_backend }}
      SKIP_FRONTEND: ${{ needs.validate.outputs.skip_frontend }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # =============================================
      # Setup SSH (combined into single step)
      # =============================================
      - name: Setup SSH and test connection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SERVER_SSH_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$SERVER_SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "whoami && docker --version"

      # =============================================
      # Build Backend
      # =============================================
      - name: Setup .NET SDK
        if: env.SKIP_BACKEND != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Transfer Backend
        if: env.SKIP_BACKEND != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Building Backend ==="

          # Build backend (skip separate build step, go straight to publish)
          cd ThesisManagement.Api
          dotnet restore ThesisManagement.Api.csproj
          dotnet publish ThesisManagement.Api.csproj \
            -c Release \
            --output ../backend-publish \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=false
          cd ..

          # Verify output
          if [ ! -f backend-publish/ThesisManagement.Api.dll ]; then
            echo "::error::ThesisManagement.Api.dll not found"
            exit 1
          fi
          echo "✓ Backend built"

          # Prepare Docker context
          mkdir -p backend-docker
          cp -r backend-publish/* backend-docker/
          cp ThesisManagement.Api/Dockerfile.runtime backend-docker/Dockerfile
          cp ThesisManagement.Api/docker-entrypoint.sh backend-docker/

          # Build Docker image with cache
          echo "=== Building Backend Docker Image ==="
          docker build --tag graduation-thesis-api:${{ github.sha }} --file backend-docker/Dockerfile backend-docker/

          # Transfer via SSH pipe
          echo "=== Transferring Backend Image ==="
          docker save graduation-thesis-api:${{ github.sha }} | \
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$SERVER_SSH_PORT" \
              "$SERVER_USER@$SERVER_HOST" \
              "docker load"
          echo "✓ Backend transferred"

      # =============================================
      # Build Frontend
      # =============================================
      - name: Setup Node.js
        if: env.SKIP_FRONTEND != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Transfer Frontend
        if: env.SKIP_FRONTEND != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Building Frontend ==="

          # Install and build
          cd thesis-frontend
          npm ci
          VITE_API_BASE_URL=/api npm run build

          # Verify output
          if [ ! -f dist/index.html ]; then
            echo "::error::index.html not found in dist"
            exit 1
          fi
          echo "✓ Frontend built"

          # Prepare Docker context
          cd ..
          mkdir -p frontend-docker
          cp -r thesis-frontend/dist/* frontend-docker/
          cp thesis-frontend/Dockerfile frontend-docker/Dockerfile
          cp thesis-frontend/nginx.conf frontend-docker/nginx.conf
          cp thesis-frontend/nginx-main.conf frontend-docker/nginx-main.conf
          cp thesis-frontend/package*.json frontend-docker/
          cp thesis-frontend/tsconfig*.json frontend-docker/
          cp thesis-frontend/vite.config.ts frontend-docker/
          cp thesis-frontend/index.html frontend-docker/
          cp thesis-frontend/tailwind.config.js frontend-docker/
          cp thesis-frontend/postcss.config.js frontend-docker/
          cp thesis-frontend/eslint.config.js frontend-docker/
          cp -r thesis-frontend/src frontend-docker/
          cp -r thesis-frontend/public frontend-docker/

          # Build Docker image WITH cache (removed --no-cache)
          echo "=== Building Frontend Docker Image ==="
          docker build --tag graduation-thesis-web:${{ github.sha }} --file frontend-docker/Dockerfile --build-arg VITE_API_BASE_URL=/api frontend-docker/

          # Transfer via SSH pipe
          echo "=== Transferring Frontend Image ==="
          docker save graduation-thesis-web:${{ github.sha }} | \
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$SERVER_SSH_PORT" \
              "$SERVER_USER@$SERVER_HOST" \
              "docker load"
          echo "✓ Frontend transferred"

      # =============================================
      # Deploy to server
      # =============================================
      - name: Deploy to server
        shell: bash
        run: |
          set -euo pipefail

          # Create .deploy.env
          printf 'BACKEND_IMAGE=graduation-thesis-api:%s\n' "${{ github.sha }}" > .deploy.env
          printf 'FRONTEND_IMAGE=graduation-thesis-web:%s\n' "${{ github.sha }}" >> .deploy.env
          printf 'PUBLIC_PORT=%s\n' "${{ secrets.PUBLIC_PORT }}" >> .deploy.env

          # Create SSH command helper
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts -p $SERVER_SSH_PORT $SERVER_USER@$SERVER_HOST"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts -P $SERVER_SSH_PORT"

          # Create remote directory
          $SSH_CMD "mkdir -p '$SERVER_APP_DIR'"

          # Verify .env.runtime
          RESULT=$($SSH_CMD "test -f '$SERVER_APP_DIR/.env.runtime' && echo EXISTS || echo NOT_FOUND")
          if [ "$RESULT" != "EXISTS" ]; then
            echo "::error::Missing .env.runtime on server"
            exit 1
          fi
          echo "✓ .env.runtime exists"

          # Upload files
          $SCP_CMD docker-compose.production.yml "$SERVER_USER@$SERVER_HOST:$SERVER_APP_DIR/"
          $SCP_CMD deploy_wait.sh "$SERVER_USER@$SERVER_HOST:$SERVER_APP_DIR/"
          $SCP_CMD .deploy.env "$SERVER_USER@$SERVER_HOST:/tmp/graduation-thesis.deploy.env"

          # Merge env files and deploy
          $SSH_CMD "chmod +x '$SERVER_APP_DIR/deploy_wait.sh' && \
            mv /tmp/graduation-thesis.deploy.env '$SERVER_APP_DIR/.deploy.env' && \
            chmod 600 '$SERVER_APP_DIR/.deploy.env' && \
            cd '$SERVER_APP_DIR' && \
            cat .deploy.env > .env && \
            printf '\n# Runtime Secrets\n' >> .env && \
            cat .env.runtime >> .env && \
            ./deploy_wait.sh docker-compose.production.yml .env graduation-thesis-api 300"
          echo "✓ Services deployed"

      - name: Healthcheck
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=12
          ATTEMPT=0

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "$SERVER_SSH_PORT" \
              "$SERVER_USER@$SERVER_HOST" \
              "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:$PUBLIC_PORT/ || echo 000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Healthcheck passed"
              exit 0
            fi

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
            sleep 5
          done

          echo "::error::Healthcheck failed"
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$SERVER_SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$SERVER_APP_DIR' && docker compose --env-file .env -f docker-compose.production.yml ps && docker logs graduation-thesis-api --tail 50"
          exit 1

      - name: Cleanup old images
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -p "$SERVER_SSH_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "docker image prune -af --filter 'until=168h' 2>/dev/null || true; echo 'Cleanup done'"
