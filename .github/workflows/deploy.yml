name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_frontend:
        description: 'Skip frontend build'
        required: false
        default: false
        type: boolean
      skip_backend:
        description: 'Skip backend build'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ============================================================
  # JOB 1: Validate Configuration
  # ============================================================
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      skip_frontend: ${{ steps.validate.outputs.skip_frontend }}
      skip_backend: ${{ steps.validate.outputs.skip_backend }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate required GitHub Secrets
        id: validate
        run: |
          echo "=== Validating GitHub Configuration ==="
          echo ""

          # Validate SERVER_HOST
          if [ -z "${{ secrets.SERVER_HOST }}" ] || [ "${{ secrets.SERVER_HOST }}" = "" ]; then
            echo "::error::SERVER_HOST is not set. Please set it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "✓ SERVER_HOST: [SET]"

          # Validate SERVER_USER
          if [ -z "${{ secrets.SERVER_USER }}" ] || [ "${{ secrets.SERVER_USER }}" = "" ]; then
            echo "::error::SERVER_USER is not set. Please set it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "✓ SERVER_USER: [SET]"

          # Validate SERVER_SSH_PORT
          if [ -z "${{ secrets.SERVER_SSH_PORT }}" ] || [ "${{ secrets.SERVER_SSH_PORT }}" = "" ]; then
            echo "::error::SERVER_SSH_PORT is not set. Please set it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

          # Validate SSH port is numeric
          if ! [[ "${{ secrets.SERVER_SSH_PORT }}" =~ ^[0-9]+$ ]]; then
            echo "::error::SERVER_SSH_PORT must be numeric"
            exit 1
          fi

          PORT=${{ secrets.SERVER_SSH_PORT }}
          if [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "::error::SERVER_SSH_PORT must be between 1 and 65535"
            exit 1
          fi
          echo "✓ SERVER_SSH_PORT: [SET]"

          # Validate SERVER_APP_DIR
          if [ -z "${{ secrets.SERVER_APP_DIR }}" ] || [ "${{ secrets.SERVER_APP_DIR }}" = "" ]; then
            echo "::error::SERVER_APP_DIR is not set. Please set it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "✓ SERVER_APP_DIR: [SET]"

          # Validate PUBLIC_PORT
          if [ -z "${{ secrets.PUBLIC_PORT }}" ] || [ "${{ secrets.PUBLIC_PORT }}" = "" ]; then
            echo "::error::PUBLIC_PORT is not set. Please set it in Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

          # Validate PUBLIC_PORT is numeric
          if ! [[ "${{ secrets.PUBLIC_PORT }}" =~ ^[0-9]+$ ]]; then
            echo "::error::PUBLIC_PORT must be numeric"
            exit 1
          fi

          PUBLIC_PORT_VAL=${{ secrets.PUBLIC_PORT }}
          if [ "$PUBLIC_PORT_VAL" -lt 1 ] || [ "$PUBLIC_PORT_VAL" -gt 65535 ]; then
            echo "::error::PUBLIC_PORT must be between 1 and 65535"
            exit 1
          fi
          echo "✓ PUBLIC_PORT: [SET]"

          # Validate SERVER_SSH_KEY (secret)
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ] || [ "${{ secrets.SERVER_SSH_KEY }}" = "" ]; then
            echo "::error::SERVER_SSH_KEY is not set. Please add it to Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          echo "✓ SERVER_SSH_KEY: [SET]"

          echo ""
          echo "=== Security Validation ==="
          echo "✓ No DB_CONNECTION_STRING in GitHub Secrets"
          echo "✓ No JWT_SECRET in GitHub Secrets"
          echo "✓ No runtime secrets in GitHub"
          echo "✓ Runtime secrets stored on server only"
          echo ""
          echo "=== Validation Passed ==="

          # Set skip flags
          SKIP_FRONTEND=${{ github.event.inputs.skip_frontend || 'false' }}
          SKIP_BACKEND=${{ github.event.inputs.skip_backend || 'false' }}
          echo "skip_frontend=$SKIP_FRONTEND" >> $GITHUB_OUTPUT
          echo "skip_backend=$SKIP_BACKEND" >> $GITHUB_OUTPUT

  # ============================================================
  # JOB 2: Build Backend (ASP.NET Core 8)
  # ============================================================
  build-backend:
    name: Build Backend
    needs: validate
    if: needs.validate.outputs.skip_backend != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Restore NuGet packages
        run: dotnet restore ThesisManagement.Api/ThesisManagement.Api.csproj

      - name: Build Backend (Release)
        run: |
          dotnet build ThesisManagement.Api/ThesisManagement.Api.csproj \
            -c Release \
            --no-restore

      - name: Publish Backend
        run: |
          dotnet publish ThesisManagement.Api/ThesisManagement.Api.csproj \
            -c Release \
            --output ./publish/backend \
            -p:PublishSingleFile=false \
            -p:PublishReadyToRun=true \
            -p:PublishTrimmed=false

      - name: Verify DLL output
        run: |
          echo "=== Verifying DLL ==="
          if [ -f "./publish/backend/ThesisManagement.Api.dll" ]; then
            echo "✓ ThesisManagement.Api.dll found"
            ls -lh ./publish/backend/ThesisManagement.Api.dll
          else
            echo "::error::ThesisManagement.Api.dll not found!"
            find ./publish/backend -name "*.dll" | head -10
            exit 1
          fi

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: ./publish/backend
          retention-days: 3

  # ============================================================
  # JOB 3: Build Frontend (React + Vite)
  # ============================================================
  build-frontend:
    name: Build Frontend
    needs: validate
    if: needs.validate.outputs.skip_frontend != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: thesis-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./thesis-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./thesis-frontend
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Verifying build output ==="
          if [ -f "thesis-frontend/dist/index.html" ]; then
            echo "✓ index.html found"
            ls -la thesis-frontend/dist/
          else
            echo "::error::index.html not found in dist/"
            exit 1
          fi

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: ./thesis-frontend/dist
          retention-days: 3

  # ============================================================
  # JOB 4: Build Docker Images
  # ============================================================
  build-docker:
    name: Build Docker Images
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: ./backend

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact
          path: ./frontend/dist

      - name: Verify artifacts
        run: |
          echo "=== Backend artifact ==="
          ls -la backend/
          echo ""
          echo "=== Frontend artifact ==="
          ls -la frontend/dist/

      # ----------------------------------------
      # Prepare backend Docker context
      # ----------------------------------------
      - name: Prepare backend Docker context
        run: |
          mkdir -p backend-docker

          # Copy pre-built published files (DLL, config, etc.)
          cp -r backend/* backend-docker/

          # Use runtime Dockerfile (no build needed, artifact is pre-built)
          cp ThesisManagement.Api/Dockerfile.runtime backend-docker/Dockerfile

          # Verify DLL exists
          if [ ! -f "backend-docker/ThesisManagement.Api.dll" ]; then
            echo "::error::ThesisManagement.Api.dll not found in backend Docker context"
            exit 1
          fi

          echo "=== Backend Docker context ==="
          ls -la backend-docker/

      # ----------------------------------------
      # Prepare frontend Docker context
      # ----------------------------------------
      - name: Prepare frontend Docker context
        run: |
          mkdir -p frontend-docker
          cp -r frontend/dist/* frontend-docker/
          cp thesis-frontend/Dockerfile frontend-docker/Dockerfile
          cp thesis-frontend/nginx.conf frontend-docker/nginx.conf

          # Copy source files needed for build
          cp thesis-frontend/package.json frontend-docker/
          cp thesis-frontend/package-lock.json frontend-docker/
          cp thesis-frontend/tsconfig*.json frontend-docker/
          cp thesis-frontend/vite.config.ts frontend-docker/
          cp thesis-frontend/index.html frontend-docker/
          cp thesis-frontend/tailwind.config.js frontend-docker/
          cp thesis-frontend/postcss.config.js frontend-docker/
          cp thesis-frontend/eslint.config.js frontend-docker/
          cp -r thesis-frontend/src frontend-docker/
          cp -r thesis-frontend/public frontend-docker/

          echo "=== Frontend Docker context ==="
          ls -la frontend-docker/
          echo ""
          echo "=== src directory ==="
          ls -la frontend-docker/src/ 2>/dev/null || echo "No src dir"

      # ----------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Build backend image
      # ----------------------------------------
      - name: Build backend Docker image
        run: |
          echo "=== Building backend image ==="
          docker build \
            --tag graduation-thesis-api:${{ github.sha }} \
            --file backend-docker/Dockerfile \
            backend-docker/

          echo "✓ Backend image built"
          docker images | grep graduation-thesis-api

      # ----------------------------------------
      # Build frontend image
      # ----------------------------------------
      - name: Build frontend Docker image
        run: |
          echo "=== Building frontend image ==="
          docker build \
            --tag graduation-thesis-web:${{ github.sha }} \
            --file frontend-docker/Dockerfile \
            frontend-docker/

          echo "✓ Frontend image built"
          docker images | grep graduation-thesis-web

      # ----------------------------------------
      # Save images to tar.gz
      # ----------------------------------------
      - name: Save Docker images
        run: |
          echo "=== Saving Docker images ==="
          docker save graduation-thesis-api:${{ github.sha }} | gzip > backend-image-${{ github.sha }}.tar.gz
          docker save graduation-thesis-web:${{ github.sha }} | gzip > frontend-image-${{ github.sha }}.tar.gz

          echo "=== Image sizes ==="
          ls -lh *.tar.gz

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image-${{ github.sha }}.tar.gz
            frontend-image-${{ github.sha }}.tar.gz
          retention-days: 2

  # ============================================================
  # JOB 5: Deploy to Server
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: [validate, build-docker]
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
      PUBLIC_PORT: ${{ secrets.PUBLIC_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: ./

      # ----------------------------------------
      # Step 1: Prepare SSH
      # ----------------------------------------
      - name: Prepare SSH key
        run: |
          echo "=== Preparing SSH ==="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          echo "${{ env.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "✓ SSH key prepared"

      - name: Create SSH known_hosts dynamically
        run: |
          echo "=== Creating SSH known_hosts ==="
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # ssh-keyscan to add host key (no SERVER_SSH_KNOWN_HOSTS needed)
          ssh-keyscan -p "${{ env.SERVER_SSH_PORT }}" "${{ env.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

          echo "✓ known_hosts created"

      # ----------------------------------------
      # Step 2: Test SSH connection
      # ----------------------------------------
      - name: Test SSH connection
        run: |
          echo "=== Testing SSH connection ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "echo '✓ SSH connection OK'; uname -a; docker --version; docker compose version"

      # ----------------------------------------
      # Step 3: Create remote directory
      # ----------------------------------------
      - name: Create remote directory
        run: |
          echo "=== Creating remote directory ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "mkdir -p ${{ env.SERVER_APP_DIR }}/images && ls -la ${{ env.SERVER_APP_DIR }}/"

      # ----------------------------------------
      # Step 4: Check .env.runtime exists
      # ----------------------------------------
      - name: Verify .env.runtime exists
        run: |
          echo "=== Checking .env.runtime ==="
          SSH_RESULT=$(ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "test -f ${{ env.SERVER_APP_DIR }}/.env.runtime && echo 'EXISTS' || echo 'NOT_FOUND'")

          if [ "$SSH_RESULT" = "NOT_FOUND" ]; then
            echo ""
            echo "::error::=============================================="
            echo "::error::Missing /opt/graduation-thesis/.env.runtime on server."
            echo "::error::Please create it manually with DB_CONNECTION_STRING,"
            echo "::error::JWT_SECRET and database variables."
            echo "::error::Runtime secrets must not be stored in GitHub Secrets."
            echo "::error::=============================================="
            exit 1
          fi

          echo "✓ .env.runtime exists on server"

      # ----------------------------------------
      # Step 5: Upload Docker images
      # ----------------------------------------
      - name: Upload Docker images via SCP
        run: |
          echo "=== Uploading Docker images ==="
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -P "${{ env.SERVER_SSH_PORT }}" \
              backend-image-${{ github.sha }}.tar.gz \
              frontend-image-${{ github.sha }}.tar.gz \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_APP_DIR }}/images/"

      # ----------------------------------------
      # Step 6: Upload docker-compose
      # ----------------------------------------
      - name: Upload docker-compose file
        run: |
          echo "=== Uploading docker-compose.production.yml ==="
          scp -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -P "${{ env.SERVER_SSH_PORT }}" \
              docker-compose.production.yml \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_APP_DIR }}/"

      # ----------------------------------------
      # Step 7: Load Docker images
      # ----------------------------------------
      - name: Load Docker images on server
        run: |
          echo "=== Loading Docker images ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }}/images && \
             docker load < backend-image-${{ github.sha }}.tar.gz && \
             docker load < frontend-image-${{ github.sha }}.tar.gz"

      # ----------------------------------------
      # Step 8: Create .deploy.env
      # ----------------------------------------
      - name: Create .deploy.env
        run: |
          echo "=== Creating .deploy.env ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            'printf "%s\n" "# Deployment Configuration" "# Auto-generated by GitHub Actions" "" "BACKEND_IMAGE=graduation-thesis-api:${{ github.sha }}" "FRONTEND_IMAGE=graduation-thesis-web:${{ github.sha }}" "PUBLIC_PORT=${{ env.PUBLIC_PORT }}" > ${{ env.SERVER_APP_DIR }}/.deploy.env'

      # ----------------------------------------
      # Step 9: Merge .deploy.env + .env.runtime -> .env
      # ----------------------------------------
      - name: Merge environment files
        run: |
          echo "=== Merging environment files ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }} && cat .deploy.env > .env && echo '' >> .env && echo '# Runtime Secrets' >> .env && cat .env.runtime >> .env"

      # ----------------------------------------
      # Step 10: Deploy with Docker Compose
      # ----------------------------------------
      - name: Deploy services
        run: |
          echo "=== Deploying with Docker Compose ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }} && docker compose --env-file .env -f docker-compose.production.yml down --remove-orphans 2>/dev/null; docker compose --env-file .env -f docker-compose.production.yml up -d --remove-orphans"

      # ----------------------------------------
      # Step 11: Wait for services to be healthy
      # ----------------------------------------
      - name: Wait for services
        run: |
          echo "=== Waiting for services ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }} && \
             MAX_WAIT=120 && \
             ELAPSED=0 && \
             INTERVAL=5 && \
             while [ \$ELAPSED -lt \$MAX_WAIT ]; do \
               RUNNING=\$(docker ps --filter 'name=graduation-thesis-api' --filter 'status=running' -q); \
               if [ -n \"\$RUNNING\" ]; then \
                 HEALTH=\$(docker exec graduation-thesis-api wget -qO- http://localhost:8080/healthz 2>/dev/null || echo 'unhealthy'); \
                 if [ \"\$HEALTH\" = 'Healthy' ] || [ \"\$HEALTH\" = 'healthy' ]; then \
                   echo 'Backend is healthy'; \
                   break; \
                 fi; \
               fi; \
               echo 'Waiting... (\$ELAPSED/\$MAX_WAIT seconds)'; \
               sleep \$INTERVAL; \
               ELAPSED=\$((ELAPSED + INTERVAL)); \
             done"

      # ----------------------------------------
      # Step 12: Healthcheck
      # ----------------------------------------
      - name: Healthcheck
        run: |
          echo "=== Running Healthcheck ==="
          MAX_ATTEMPTS=12
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Healthcheck attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(ssh -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -p "${{ env.SERVER_SSH_PORT }}" \
                "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
                "curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:${{ env.PUBLIC_PORT }}/ || echo '000'")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Healthcheck passed! HTTP Status: $HTTP_CODE"
              exit 0
            fi

            echo "  HTTP Status: $HTTP_CODE, waiting 5s..."
            sleep 5
          done

          echo "::error::Healthcheck failed after $MAX_ATTEMPTS attempts"
          echo ""
          echo "=== Debug: Backend logs ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "docker logs graduation-thesis-api --tail 50"
          echo ""
          echo "=== Debug: Frontend logs ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "docker logs graduation-thesis-web --tail 50"

          exit 1

      # ----------------------------------------
      # Step 13: Final verification
      # ----------------------------------------
      - name: Final verification
        run: |
          echo "=== Final Verification ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }} && \
             echo 'Running Containers:' && \
             docker ps --filter 'name=graduation-thesis' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' && \
             echo 'Backend Health:' && \
             docker exec graduation-thesis-api wget -qO- http://localhost:8080/healthz 2>/dev/null || echo 'FAILED' && \
             echo 'Docker Images:' && \
             docker images | grep graduation-thesis"

  # ============================================================
  # JOB 6: Cleanup (always runs)
  # ============================================================
  cleanup:
    name: Cleanup
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
    steps:
      - name: Cleanup old image tar.gz files
        run: |
          echo "=== Cleaning up old image files ==="
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -p "${{ env.SERVER_SSH_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
            "cd ${{ env.SERVER_APP_DIR }}/images && \
             find . -name '*.tar.gz' ! -name '*${{ github.sha }}.tar.gz' -delete 2>/dev/null || true"
