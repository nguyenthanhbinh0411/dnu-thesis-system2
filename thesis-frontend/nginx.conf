# ============================================
# Server Block Configuration
# This file is included from /etc/nginx/nginx.conf main context
# ============================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # Static files caching
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ============================================
    # API Proxy - Backend ASP.NET
    # ============================================
    location /api/ {
        # Proxy to backend container (using host.docker.internal since backend uses host network)
        proxy_pass http://host.docker.internal:9699/api/;
            
        # Required headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
            
        # Connection settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
            
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
            
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 1024m;
    }

    # ============================================
    # SignalR WebSocket Proxy
    # ============================================
    location /hubs/ {
        # Proxy to backend for SignalR hubs (using host.docker.internal since backend uses host network)
        proxy_pass http://host.docker.internal:9699/hubs/;
            
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
            
        # Disable buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
            
        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================
    # Swagger (Development only - disable in prod)
    # ============================================
    location /swagger {
        return 404;
    }

    # ============================================
    # Health check endpoint
    # ============================================
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # React SPA - Must be last routing rule
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
            
        # Cache control for index.html (no cache)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================
    # Error pages
    # ============================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
